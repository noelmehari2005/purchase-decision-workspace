<div id="purchase-wireframe">
<header><span>Purchase Decision Workspace</span><span class="small">Wireframe · fictional example</span></header>
<div class="intro"><h2>Alex’s next laptop</h2><p>Understand your needs. Compare your options. Make your own plan.</p></div>
<nav aria-label="Decision steps"></nav>
<main id="pw-content"></main>
<footer><button type="button" id="pw-back">Back</button><span id="pw-position" class="small"></span><button type="button" id="pw-next" class="primary">Continue</button></footer>
</div>
<style>
#purchase-wireframe{--pw-bg:light-dark(#ffffff,#202020);--pw-text:light-dark(#242424,#eeeeee);--pw-muted:light-dark(#5b5b5b,#bdbdbd);--pw-line:light-dark(#d3d3d3,#515151);--pw-soft:light-dark(#f4f4f4,#2c2c2c);--pw-active:light-dark(#303030,#e4e4e4);--pw-on:light-dark(#ffffff,#242424);font:400 15px/1.5 system-ui,sans-serif;color:var(--pw-text);background:var(--pw-bg);border:1px solid var(--pw-line);border-radius:8px;overflow:hidden}
#purchase-wireframe *{box-sizing:border-box}#purchase-wireframe header,#purchase-wireframe footer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 22px;background:var(--pw-soft)}#purchase-wireframe header{padding-right:100px}#purchase-wireframe h2{font-size:23px;font-weight:500;margin:0}#purchase-wireframe h3{font-size:18px;font-weight:500;margin:0 0 12px}#purchase-wireframe p{margin:8px 0 16px}#purchase-wireframe .intro{padding:22px 22px 8px}#purchase-wireframe .intro p,#purchase-wireframe .small{color:var(--pw-muted);font-size:13px}#purchase-wireframe nav{display:flex;flex-wrap:wrap;gap:8px;padding:8px 22px 20px;border-bottom:1px solid var(--pw-line)}#purchase-wireframe button{font:inherit;color:var(--pw-text);background:var(--pw-bg);border:1px solid var(--pw-line);border-radius:5px;padding:9px 14px;cursor:pointer}#purchase-wireframe button.primary,#purchase-wireframe button[aria-current="step"]{background:var(--pw-active);color:var(--pw-on);border-color:var(--pw-active)}#purchase-wireframe button:disabled{opacity:.45;cursor:default}#purchase-wireframe main{padding:24px;min-height:440px}#purchase-wireframe .row{display:flex;align-items:center;flex-wrap:wrap;gap:10px}#purchase-wireframe .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}#purchase-wireframe .panel{border:1px solid var(--pw-line);padding:16px;border-radius:5px}#purchase-wireframe .note{padding:12px 14px;background:var(--pw-soft);margin:14px 0}#purchase-wireframe label{display:block;margin:10px 0}#purchase-wireframe input:not([type=checkbox]):not([type=radio]),#purchase-wireframe select,#purchase-wireframe textarea{display:block;width:100%;font:inherit;color:var(--pw-text);background:var(--pw-bg);border:1px solid var(--pw-line);border-radius:4px;padding:9px;margin-top:5px}#purchase-wireframe input[type=checkbox],#purchase-wireframe input[type=radio]{accent-color:var(--pw-active);width:17px;height:17px;vertical-align:middle;margin-right:8px}#purchase-wireframe .task{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,180px);align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--pw-line)}#purchase-wireframe .task select{margin:0}#purchase-wireframe .tag{display:inline-block;background:var(--pw-soft);padding:3px 7px;font-size:13px}#purchase-wireframe ul{padding-left:20px}#purchase-wireframe .table-wrap{overflow-x:auto}#purchase-wireframe table{border-collapse:collapse;width:100%;min-width:520px}#purchase-wireframe th,#purchase-wireframe td{text-align:left;vertical-align:top;padding:12px 9px;border-bottom:1px solid var(--pw-line)}#purchase-wireframe th{font-weight:500}#purchase-wireframe output{display:block}#purchase-wireframe [hidden]{display:none!important}#purchase-wireframe .error{color:light-dark(#a51c1c,#ffb0b0)}@media(max-width:580px){#purchase-wireframe .grid{grid-template-columns:1fr}#purchase-wireframe main{padding:16px}#purchase-wireframe nav{padding:8px 16px 16px}#purchase-wireframe header{padding-right:80px}#purchase-wireframe .task{grid-template-columns:1fr}#purchase-wireframe button{min-height:44px}}
</style>
<script>
(()=>{
const root=document.getElementById('purchase-wireframe');
const defaults={step:0,tasks:[true,true,true,true,false,false],experience:['Works adequately','Works adequately','Struggles','I’m not sure','I’m not sure','I’m not sure'],ram:'8 GB',cpu:'',notes:'My laptop slows down when my backend, database, editor, and browser are open.',budget:true,savings:300,income:1600,housing:700,food:250,transport:180,other:120,goals:150,contribution:150,reduction:40,scenario:false,deadline:3,choice:'Investigate and save',reason:'Confirm tool compatibility and investigate the slowdown before committing.',saved:false};
let state={...defaults};
const steps=['Needs','Current laptop','Compare','Purchase plan','Decision'];
const tasks=['Basic programming','Web development','Backend + local database','Docker (upcoming)','Larger projects with an IDE','Several development tools at once'];
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(n);
function restore(saved){if(saved&&saved.modelContent&&saved.modelContent.prototype==='laptop-wireframe'){const s=saved.privateContent;if(s&&Number.isInteger(s.step)&&s.step>=0&&s.step<5)state={...defaults,...s};}}
restore(window.openai?.widgetState);
function persist(){window.openai?.setWidgetState?.({modelContent:{prototype:'laptop-wireframe',step:steps[state.step],choice:state.choice,contribution:state.contribution,scenario:state.scenario},privateContent:state})?.catch(()=>{});}
const content=root.querySelector('main');
function field(key,label){return `<label>${label}<input data-number="${key}" type="number" min="0" step="any" value="${state[key]}"></label>`;}
function render(){
root.querySelector('nav').innerHTML=steps.map((s,i)=>`<button type="button" data-step="${i}" ${i===state.step?'aria-current="step"':''}>${i+1}. ${s}</button>`).join('');
root.querySelector('#pw-back').disabled=state.step===0;
root.querySelector('#pw-next').textContent=state.step===4?'Save sample decision':'Continue';
root.querySelector('#pw-position').textContent=`Step ${state.step+1} of 5`;
if(state.step===0)content.innerHTML=`<h3>What do you need your laptop to do?</h3><p>Select your tasks, then describe how your current laptop handles them.</p>${tasks.map((t,i)=>`<div class="task"><label><input type="checkbox" data-task="${i}" ${state.tasks[i]?'checked':''}>${t}</label><label class="small">Current experience<select data-experience="${i}" ${state.tasks[i]?'':'disabled'}>${['Works adequately','Struggles','Cannot do it','I’m not sure'].map(v=>`<option ${state.experience[i]===v?'selected':''}>${v}</option>`).join('')}</select></label></div>`).join('')}<label>Other needs or required tools (optional)<input data-text="custom" value="${esc(state.custom||'')}" placeholder="For example: a tool required for a course"></label><p class="small">Not sure yet? You can continue without choosing tasks. Requirements can be revised later.</p>`;
if(state.step===1)content.innerHTML=`<h3>What do you know about your current laptop?</h3><p>Unknown details won’t stop you from comparing options.</p><div class="grid"><label>Memory (RAM)<select data-text="ram">${['I’m not sure','8 GB','16 GB','32 GB'].map(v=>`<option ${v===state.ram?'selected':''}>${v}</option>`).join('')}</select></label><label>Processor (CPU)<input data-text="cpu" value="${esc(state.cpu)}" placeholder="I’m not sure"></label></div><details><summary>Where can I find these details?</summary><p>Windows: Settings → System → About. macOS: Apple menu → About This Mac. You can leave a field unknown.</p></details><label>What difficulties have you noticed?<textarea rows="3" data-text="notes">${esc(state.notes)}</textarea></label><div class="note"><strong>Assessment incomplete</strong><p>Your observations identify difficulties, but do not establish their cause. Upcoming tool requirements still need verification.</p><span class="small">No automatic scan or hardware diagnosis.</span></div>`;
if(state.step===2)content.innerHTML=`<h3>Compare keeping your laptop with replacements</h3><p>Sample candidates are prefilled for this wireframe. All product details and costs are fictional.</p><div class="table-wrap"><table><thead><tr><th>Evidence / preference</th><th>Keep current</th><th>Candidate A</th><th>Candidate B</th></tr></thead><tbody><tr><th>Purchase cost</th><td>$0 additional</td><td>$800 estimated total</td><td>$1,100 estimated total</td></tr><tr><th>Memory</th><td>${esc(state.ram)}</td><td>16 GB</td><td>32 GB</td></tr><tr><th>Required tools</th><td>Not confirmed</td><td>Not confirmed</td><td>Not confirmed</td></tr><tr><th>Your experience</th><td>See current assessment</td><td>Not tried</td><td>Not tried</td></tr><tr><th>Portability preference</th><td>Not entered</td><td>Not entered</td><td>Not entered</td></tr><tr><th>Evidence</th><td>User-entered details</td><td>No source added</td><td>No source added</td></tr></tbody></table></div><details><summary>Add candidate details (preview)</summary><p>The full entry form is still to design: exact configuration, price, source links, specifications, and notes.</p></details><div class="note">No ranking yet. Unknown compatibility stays unconfirmed. More memory alone doesn’t establish a better fit.</div><label>What matters most to you?<select data-text="priority">${['Choose a preference','Portability','Battery life','Performance for my tools','Repairability'].map(v=>`<option ${state.priority===v?'selected':''}>${v}</option>`).join('')}</select></label>`;
if(state.step===3)content.innerHTML=`<h3>Choose a purchase plan</h3><p>Amounts are USD. Alex decides the contribution and any spending changes.</p><div class="grid">${field('savings','Money already set aside for this purchase ($)')}${field('deadline','Target: number of monthly contributions')}</div><label><input type="checkbox" data-bool="budget" ${state.budget?'checked':''}>Include an optional monthly budget</label><div id="pw-budget" ${state.budget?'':'hidden'}><div class="grid">${field('income','Take-home income ($ / month)')}${field('housing','Housing ($ / month)')}${field('food','Food ($ / month)')}${field('transport','Transportation ($ / month)')}${field('other','Other expenses and commitments ($ / month)')}${field('goals','Reserved for other goals ($ / month)')}</div></div><div class="grid">${field('contribution','Your chosen contribution ($ / month)')}<div><label><input type="checkbox" data-bool="scenario" ${state.scenario?'checked':''}>Explore a transportation spending reduction</label>${field('reduction','Possible reduction ($ / month)')}</div></div><output id="pw-results" aria-live="polite"></output>`;
if(state.step===4)content.innerHTML=`<h3>Your decision can stay open</h3><label>Current direction<select data-text="choice">${['Investigate and save','Keep my laptop','Plan for Candidate A','Plan for Candidate B','Undecided'].map(v=>`<option ${v===state.choice?'selected':''}>${v}</option>`).join('')}</select></label><label>Your reasoning and next steps<textarea rows="3" data-text="reason">${esc(state.reason)}</textarea></label><div class="note"><strong>Assumptions to revisit</strong><ul><li>Candidate compatibility and product sources are unconfirmed.</li><li>Prices, income, expenses, and contributions may change.</li><li>Current laptop difficulties have not been diagnosed.</li></ul></div><p>Chosen base contribution: <strong>${money(state.contribution)} / month</strong>${state.scenario?`; optional scenario: ${money(state.contribution+state.reduction)} / month`:''}.</p><p id="pw-saved" role="status">${state.saved?'Sample decision saved within this preview. No account or database is connected.':'Save this sample to try the final step. You can return and revise any step.'}</p>`;
results();
}
function results(){const out=root.querySelector('#pw-results');if(!out)return;const remaining=state.income-state.housing-state.food-state.transport-state.other-state.goals;const amounts=['savings','deadline','income','housing','food','transport','other','goals','contribution','reduction'];const valid=amounts.every(k=>Number.isFinite(state[k])&&state[k]>=0)&&Number.isInteger(state.deadline)&&state.deadline>0;
if(!valid){out.innerHTML='<p class="error" role="alert">Enter nonnegative amounts and a positive whole number of contributions.</p>';return;}
const count=(cost,rate)=>{const gap=Math.max(0,cost-state.savings);return gap===0?'Already funded':rate===0?'Not reached at $0 / month':`${Math.ceil(gap/rate)} monthly contributions`;};
out.innerHTML=`${state.budget?`<p>Remaining after entered commitments: <strong>${money(remaining)} / month</strong>. This is not a recommendation to commit all of it.</p>`:''}<div class="table-wrap"><table><thead><tr><th>Option</th><th>Needed monthly for your target</th><th>Original plan</th>${state.scenario?'<th>Spending-change scenario</th>':''}</tr></thead><tbody>${[['Candidate A',800],['Candidate B',1100]].map(([name,cost])=>`<tr><th>${name}</th><td>${money(Math.ceil(Math.max(0,cost-state.savings)/state.deadline*100)/100)}</td><td>${count(cost,state.contribution)}</td>${state.scenario?`<td>${count(cost,state.contribution+state.reduction)}</td>`:''}</tr>`).join('')}</tbody></table></div>${state.budget&&state.contribution>remaining?'<p role="status">Your chosen contribution exceeds the amount remaining in this budget. Review the inputs or explore a different plan.</p>':''}${state.scenario&&state.budget&&state.reduction>state.transport?'<p role="status">This reduction exceeds the transportation expense entered. The scenario needs revision.</p>':''}<p class="small">Assumes unchanged costs and equal monthly contributions; no interest or investment returns. Protected savings are excluded from purchase savings. The original budget remains unchanged.</p>`;
}
root.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;if(button.dataset.step!==undefined)state.step=Number(button.dataset.step);else if(button.id==='pw-back')state.step=Math.max(0,state.step-1);else if(button.id==='pw-next'){if(state.step<4)state.step++;else state.saved=true;}else return;render();persist();});
root.addEventListener('change',e=>{const el=e.target;const d=el.dataset;if(d.task!==undefined){state.tasks[+d.task]=el.checked;render();}else if(d.experience!==undefined)state.experience[+d.experience]=el.value;else if(d.bool){state[d.bool]=el.checked;render();}else if(d.text)state[d.text]=el.value;else return;state.saved=false;persist();});
root.addEventListener('input',e=>{const d=e.target.dataset;if(d.number){state[d.number]=e.target.value===''?NaN:Number(e.target.value);results();state.saved=false;persist();}else if(d.text){state[d.text]=e.target.value;state.saved=false;persist();}});
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
render();
})();
</script>
